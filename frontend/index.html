<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Accountable</title>
    <!-- Sets the saved theme before the first paint, so the page never flashes the other one (M2). -->
    <script>
      try {
        var saved = localStorage.getItem("accountable.theme");
        var dark =
          saved === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
            : saved !== "light";
        if (dark) document.documentElement.dataset.theme = "dark";
      } catch {
        // Storage is blocked: open dark, the theme until someone picks another (M1).
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
