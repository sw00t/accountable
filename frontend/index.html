<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Accountable</title>
    <!-- Sets the saved mode before the first paint, so a dark page never flashes light (M2). -->
    <script>
      try {
        if (localStorage.getItem("accountable.theme") === "dark") {
          document.documentElement.dataset.theme = "dark";
        }
      } catch {
        // Storage is blocked: open in light mode.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
